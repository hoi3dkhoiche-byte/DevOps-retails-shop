name: Retail Ansible

on:
  pull_request:
    branches: [main]
    paths: ["ansible/**", "scripts/infra/**", "scripts/setup-controller.sh", ".github/workflows/ansible.yml"]
  push:
    branches: [main]
    paths: ["ansible/**", "scripts/infra/**", "scripts/setup-controller.sh", ".github/workflows/ansible.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: retail-ansible-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: ansible-validate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ansible
    env:
      ANSIBLE_CONFIG: ${{ github.workspace }}/ansible/ansible.cfg
    steps:
      - name: Check out the infrastructure source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Check out the tested GitOps contract
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: hoi3dkhoiche-byte/DevOps-retails-shop-gitops
          ref: 6d174b5f082e745c8f33d0b6d53229eb8d0b1ca7
          path: .ci-tools/gitops-publish
          token: ${{ secrets.SOURCE_READ_TOKEN || github.token }}
          persist-credentials: false
      - name: Install the tested controller Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ansible/requirements.txt
      - name: Install the controller dependency lock
        run: python -m pip install --require-hashes -r requirements.txt
      - name: Install the pinned Kubernetes collection
        run: ansible-galaxy collection install -r requirements.yml -p .collections
      - name: Test the target, candidate and bootstrap guards without AWS
        run: python -B -m unittest discover -s tests -p 'test_*.py' -v
      - name: Check the local controller installer without downloading or installing tools
        run: |
          bash -n ../scripts/setup-controller.sh
          python -B -m unittest discover -s ../scripts/infra -p 'test_controller_setup.py' -v
      - name: Lint playbooks and roles
        run: ansible-lint --offline
      - name: Check all playbook syntax
        run: |
          set -euo pipefail
          for play in preflight init-platform bootstrap-backends prepare-gitops bootstrap-argocd verify rotate-credentials verify-operations restore-drill; do
            ansible-playbook --syntax-check "$play.yml"
          done
      - name: Run the offline preflight playbook
        run: ansible-playbook preflight.yml
