name: Retail Terraform

on:
  pull_request:
    branches: [main]
    paths: ["infra/**", "scripts/infra/**", ".github/workflows/terraform.yml"]
  workflow_dispatch:
    inputs:
      operation:
        description: Plan first; review the artifact before a separate apply run
        type: choice
        options: [plan, apply]
        default: plan
        required: true
      plan_run_id:
        description: Successful plan workflow run ID, required for apply
        type: string
      plan_attempt:
        description: Attempt of the reviewed plan run
        type: string
        default: "1"
      approved_sha256:
        description: SHA256 shown by the plan job, required for apply
        type: string

permissions:
  contents: read

concurrency:
  group: retail-terraform-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'state' }}
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false
      - run: terraform -chdir=infra/retail-lab fmt -check -recursive
      - run: terraform -chdir=infra/retail-lab init -backend=false -input=false -lockfile=readonly
      - run: terraform -chdir=infra/retail-lab validate -no-color
      - run: python3 -B -m unittest discover -s scripts/infra -p 'test_*.py' -v
      - name: Verify platform credential generation without AWS
        run: |
          python3 -m venv /tmp/retail-infra-verify
          /tmp/retail-infra-verify/bin/pip install --require-hashes -r scripts/infra/requirements.txt
          /tmp/retail-infra-verify/bin/python -B scripts/infra/crypto_smoke.py

  plan:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.operation == 'plan'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708
        id: aws
        with:
          role-to-assume: ${{ vars.TERRAFORM_ROLE_ARN }}
          role-session-name: retail-plan-${{ github.run_id }}
          role-duration-seconds: 7200
          aws-region: ap-southeast-1
      - name: Materialize reviewed non-secret infrastructure inputs
        env:
          TFVARS_JSON: ${{ vars.TERRAFORM_TFVARS_JSON }}
        run: python3 scripts/infra/write_tfvars.py
      - run: python3 scripts/infra/preflight.py --tfvars infra/retail-lab/terraform.tfvars.json
      - run: terraform -chdir=infra/retail-lab init -input=false -lockfile=readonly
      - run: mkdir -p infra/retail-lab/reviewed-plan
      - run: terraform -chdir=infra/retail-lab plan -input=false -lock-timeout=300s -out=reviewed-plan/terraform.tfplan
      - run: terraform -chdir=infra/retail-lab show -no-color reviewed-plan/terraform.tfplan > infra/retail-lab/reviewed-plan/terraform-plan.txt
      - run: python3 scripts/infra/plan_contract.py record
        env:
          TERRAFORM_ROLE_ARN: ${{ vars.TERRAFORM_ROLE_ARN }}
          AWS_ACCOUNT_ID: ${{ steps.aws.outputs.aws-account-id }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: terraform-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: infra/retail-lab/reviewed-plan/
          if-no-files-found: error
          retention-days: 1

  apply:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.operation == 'apply'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.plan_run_id }}
          name: terraform-plan-${{ inputs.plan_run_id }}-${{ inputs.plan_attempt }}
          path: infra/retail-lab/reviewed-plan
      - name: Verify the separately reviewed saved plan before AWS login
        env:
          GH_TOKEN: ${{ github.token }}
          PLAN_RUN_ID: ${{ inputs.plan_run_id }}
          PLAN_ATTEMPT: ${{ inputs.plan_attempt }}
          APPROVED_SHA256: ${{ inputs.approved_sha256 }}
          TERRAFORM_ROLE_ARN: ${{ vars.TERRAFORM_ROLE_ARN }}
        run: python3 scripts/infra/plan_contract.py verify
      - uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708
        with:
          role-to-assume: ${{ vars.TERRAFORM_ROLE_ARN }}
          role-session-name: retail-apply-${{ github.run_id }}
          role-duration-seconds: 7200
          aws-region: ap-southeast-1
      - run: terraform -chdir=infra/retail-lab init -input=false -lockfile=readonly
      - run: terraform -chdir=infra/retail-lab apply -input=false -lock-timeout=300s reviewed-plan/terraform.tfplan
