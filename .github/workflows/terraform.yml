name: Retail Terraform

on:
  push:
    branches: [main]
    paths: ["infra/**", "scripts/infra/**", ".github/workflows/terraform.yml"]
  pull_request:
    branches: [main]
    paths: ["infra/**", "scripts/infra/**", ".github/workflows/terraform.yml"]
  workflow_dispatch:
    inputs:
      operation:
        description: Validate first; create and teardown each require a separately reviewed saved plan
        type: choice
        options: [validate, plan, apply, destroy-plan, destroy-apply]
        default: validate
        required: true
      plan_run_id:
        description: Successful plan workflow run ID, required for apply
        type: string
      plan_attempt:
        description: Attempt of the reviewed plan run
        type: string
        default: "1"
      approved_sha256:
        description: SHA256 shown by the plan job, required for apply
        type: string
      teardown_account_id:
        description: Exact AWS account ID for teardown; IAM and state are retained
        type: string
      confirm_project:
        description: Type retail-lab for teardown after draining applications and persistent data
        type: string
      platform_secret_deletion:
        description: External platform credentials after backends are gone; immediate requires recorded lab recovery=0 proof
        type: choice
        options: [schedule, lab-immediate]
        default: schedule

permissions:
  contents: read

concurrency:
  group: retail-terraform-${{ github.event_name == 'workflow_dispatch' && 'state' || format('validate-{0}', github.event.pull_request.number || github.ref) }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false
      - run: terraform -chdir=infra/retail-lab fmt -check -recursive
      - run: terraform -chdir=infra/retail-lab init -backend=false -input=false -lockfile=readonly
      - run: terraform -chdir=infra/retail-lab validate -no-color
      - name: Test VPC endpoint and OpenSearch role prerequisites without AWS
        run: terraform -chdir=infra/retail-lab test -no-color
      - run: python3 -B -m unittest discover -s scripts/infra -p 'test_*.py' -v
      - name: Verify platform credential generation without AWS
        run: |
          python3 -m venv /tmp/retail-infra-verify
          /tmp/retail-infra-verify/bin/pip install --require-hashes -r scripts/infra/requirements.txt
          /tmp/retail-infra-verify/bin/python -B scripts/infra/crypto_smoke.py
      - name: Verify the exact Alpine bootstrap image and hashed dependencies
        run: python3 -B scripts/infra/dependency_smoke.py
      - name: Verify permissions against real RabbitMQ and OpenSearch fixtures
        run: |
          set -euo pipefail
          python3 -m venv /tmp/retail-permissions
          /tmp/retail-permissions/bin/pip install --require-hashes -r scripts/infra/requirements-permissions.txt
          PERMISSIONS_FIXTURE_ADMIN_PASSWORD="FixtureAa9!$(openssl rand -hex 24)"
          export PERMISSIONS_FIXTURE_ADMIN_PASSWORD
          sudo sysctl -w vm.max_map_count=262144
          trap 'docker compose -f scripts/infra/permissions-fixtures.yml down --volumes' EXIT
          docker compose -f scripts/infra/permissions-fixtures.yml up --detach --wait --wait-timeout 300
          /tmp/retail-permissions/bin/python -B scripts/infra/permissions_smoke.py --prove-legacy

  plan:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.operation == 'plan'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708
        id: aws
        with:
          role-to-assume: ${{ vars.TERRAFORM_ROLE_ARN }}
          role-session-name: retail-plan-${{ github.run_id }}
          role-duration-seconds: 7200
          aws-region: ap-southeast-1
      - name: Materialize reviewed non-secret infrastructure inputs
        env:
          TFVARS_JSON: ${{ vars.TERRAFORM_TFVARS_JSON }}
        run: python3 scripts/infra/write_tfvars.py
      - run: python3 scripts/infra/preflight.py --tfvars infra/retail-lab/terraform.tfvars.json
      - run: terraform -chdir=infra/retail-lab init -input=false -lockfile=readonly
      - run: mkdir -p infra/retail-lab/reviewed-plan
      - run: terraform -chdir=infra/retail-lab plan -input=false -lock-timeout=300s -out=reviewed-plan/terraform.tfplan
      - name: Refuse retained IAM collisions before publishing a create plan
        env:
          AWS_ACCOUNT_ID: ${{ steps.aws.outputs.aws-account-id }}
        run: python3 scripts/infra/lab_teardown.py guard-create --account-id "$AWS_ACCOUNT_ID" --plan infra/retail-lab/reviewed-plan/terraform.tfplan
      - run: terraform -chdir=infra/retail-lab show -no-color reviewed-plan/terraform.tfplan > infra/retail-lab/reviewed-plan/terraform-plan.txt
      - run: python3 scripts/infra/plan_contract.py record
        env:
          TERRAFORM_ROLE_ARN: ${{ vars.TERRAFORM_ROLE_ARN }}
          AWS_ACCOUNT_ID: ${{ steps.aws.outputs.aws-account-id }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: terraform-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: infra/retail-lab/reviewed-plan/
          if-no-files-found: error
          retention-days: 1

  apply:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.operation == 'apply'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.plan_run_id }}
          name: terraform-plan-${{ inputs.plan_run_id }}-${{ inputs.plan_attempt }}
          path: infra/retail-lab/reviewed-plan
      - name: Verify the separately reviewed saved plan before AWS login
        env:
          GH_TOKEN: ${{ github.token }}
          PLAN_RUN_ID: ${{ inputs.plan_run_id }}
          PLAN_ATTEMPT: ${{ inputs.plan_attempt }}
          APPROVED_SHA256: ${{ inputs.approved_sha256 }}
          TERRAFORM_ROLE_ARN: ${{ vars.TERRAFORM_ROLE_ARN }}
        run: python3 scripts/infra/plan_contract.py verify
      - uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708
        with:
          role-to-assume: ${{ vars.TERRAFORM_ROLE_ARN }}
          role-session-name: retail-apply-${{ github.run_id }}
          role-duration-seconds: 7200
          aws-region: ap-southeast-1
      - run: terraform -chdir=infra/retail-lab init -input=false -lockfile=readonly
      - name: Check the saved plan profile and admin-owned workload boundary
        run: |
          python3 - <<'PY'
          import json
          import subprocess
          import sys
          with open("infra/retail-lab/reviewed-plan/metadata.json", encoding="utf-8") as source:
              reviewed = json.load(source)
          subprocess.run([sys.executable, "scripts/infra/preflight.py",
                          "--boundary-account-id", reviewed["aws_account_id"],
                          "--reviewed-plan", "infra/retail-lab/reviewed-plan/terraform.tfplan"], check=True)
          subprocess.run([sys.executable, "scripts/infra/lab_teardown.py", "guard-create",
                          "--account-id", reviewed["aws_account_id"],
                          "--plan", "infra/retail-lab/reviewed-plan/terraform.tfplan"], check=True)
          PY
      - run: terraform -chdir=infra/retail-lab apply -input=false -lock-timeout=300s reviewed-plan/terraform.tfplan
      - name: Export allowlisted deployment metadata for bootstrap
        run: |
          umask 077
          terraform -chdir=infra/retail-lab output -json > "$RUNNER_TEMP/retail-all-outputs.json"
          python3 scripts/infra/export_outputs.py --input "$RUNNER_TEMP/retail-all-outputs.json" --output infra/retail-lab/deployment-context/terraform-outputs.json --metadata-output infra/retail-lab/deployment-context/metadata.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: deployment-context-${{ github.run_id }}-${{ github.run_attempt }}
          path: infra/retail-lab/deployment-context/
          if-no-files-found: error
          retention-days: 7

  destroy-plan:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.operation == 'destroy-plan'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    env:
      TEARDOWN_ACCOUNT_ID: ${{ inputs.teardown_account_id }}
      CONFIRM_PROJECT: ${{ inputs.confirm_project }}
      TERRAFORM_ROLE_ARN: ${{ vars.TERRAFORM_ROLE_ARN }}
      PLATFORM_SECRET_RECOVERY_DAYS: ${{ inputs.platform_secret_deletion == 'lab-immediate' && '0' || '7' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708
        with:
          role-to-assume: ${{ vars.TERRAFORM_ROLE_ARN }}
          role-session-name: retail-destroy-plan-${{ github.run_id }}
          role-duration-seconds: 7200
          allowed-account-ids: ${{ inputs.teardown_account_id }}
          aws-region: ap-southeast-1
      - run: terraform -chdir=infra/retail-lab init -input=false -lockfile=readonly
      - name: Verify ownership and drain prerequisites; prepare isolated teardown root
        # Hosted CI fails closed if the cluster still exists; use the operator
        # controller for the full live-cluster teardown. See docs/LAB_TEARDOWN.md.
        # Cleanup deliberately has no PAID-account gate.
        run: python3 scripts/infra/lab_teardown.py prepare --account-id "$TEARDOWN_ACCOUNT_ID" --confirm-project "$CONFIRM_PROJECT" --platform-secret-recovery-days "$PLATFORM_SECRET_RECOVERY_DAYS"
      - run: terraform -chdir=.ci-tools/lab-teardown init -input=false -lockfile=readonly
      - name: Create saved keep-IAM teardown plan
        # Ordinary plan plus removed{destroy=false}; never replace with -destroy.
        run: |
          terraform -chdir=.ci-tools/lab-teardown plan -input=false -lock-timeout=300s -out=terraform.tfplan
          terraform -chdir=.ci-tools/lab-teardown show -no-color terraform.tfplan > .ci-tools/lab-teardown/terraform-plan.txt
          python3 scripts/infra/lab_teardown.py record --account-id "$TEARDOWN_ACCOUNT_ID"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: terraform-teardown-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          path: |
            .ci-tools/lab-teardown/versions.tf
            .ci-tools/lab-teardown/.terraform.lock.hcl
            .ci-tools/lab-teardown/retained.tf
            .ci-tools/lab-teardown/retained-resources.json
            .ci-tools/lab-teardown/scope.json
            .ci-tools/lab-teardown/metadata.json
            .ci-tools/lab-teardown/terraform.tfplan
            .ci-tools/lab-teardown/terraform-plan.txt
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: retained-iam-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-tools/lab-teardown/retained-resources.json
          if-no-files-found: error
          retention-days: 90

  destroy-apply:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.operation == 'destroy-apply'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      TEARDOWN_ACCOUNT_ID: ${{ inputs.teardown_account_id }}
      CONFIRM_PROJECT: ${{ inputs.confirm_project }}
      TERRAFORM_ROLE_ARN: ${{ vars.TERRAFORM_ROLE_ARN }}
      GH_TOKEN: ${{ github.token }}
      PLAN_RUN_ID: ${{ inputs.plan_run_id }}
      PLAN_ATTEMPT: ${{ inputs.plan_attempt }}
      APPROVED_SHA256: ${{ inputs.approved_sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.plan_run_id }}
          name: terraform-teardown-${{ inputs.plan_run_id }}-${{ inputs.plan_attempt }}
          path: .ci-tools/lab-teardown
      - name: Verify reviewed teardown provenance before AWS login
        run: python3 scripts/infra/lab_teardown.py verify --account-id "$TEARDOWN_ACCOUNT_ID" --confirm-project "$CONFIRM_PROJECT"
      - uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708
        with:
          role-to-assume: ${{ vars.TERRAFORM_ROLE_ARN }}
          role-session-name: retail-destroy-apply-${{ github.run_id }}
          role-duration-seconds: 7200
          allowed-account-ids: ${{ inputs.teardown_account_id }}
          aws-region: ap-southeast-1
      - run: terraform -chdir=.ci-tools/lab-teardown init -input=false -lockfile=readonly
      - name: Recheck live drain gates and immutable binary actions
        run: python3 scripts/infra/lab_teardown.py check --account-id "$TEARDOWN_ACCOUNT_ID" --confirm-project "$CONFIRM_PROJECT"
      - name: Apply only the reviewed keep-IAM teardown plan
        run: |
          terraform -chdir=.ci-tools/lab-teardown apply -input=false -lock-timeout=300s terraform.tfplan
          python3 scripts/infra/lab_teardown.py complete --account-id "$TEARDOWN_ACCOUNT_ID"
          python3 scripts/infra/lab_teardown.py finalize-platform --account-id "$TEARDOWN_ACCOUNT_ID" --confirm-project "$CONFIRM_PROJECT"
      - name: Keep the recovery manifest even after an interrupted cleanup
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: retained-iam-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-tools/lab-teardown/retained-resources.json
          if-no-files-found: warn
          retention-days: 90
