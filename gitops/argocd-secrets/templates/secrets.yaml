apiVersion: v1
kind: Namespace
metadata:
  name: argocd
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets-reader
  namespace: argocd
  annotations:
    eks.amazonaws.com/role-arn: {{ index .Values.roles "eso-argocd" | default "REPLACE_FROM_TERRAFORM" | quote }}
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: retail-argocd-secrets
  namespace: argocd
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-southeast-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets-reader
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-admin
  namespace: argocd
spec:
  refreshInterval: 5m
  secretStoreRef: {name: retail-argocd-secrets, kind: SecretStore}
  target:
    name: argocd-secret
    template:
      engineVersion: v2
      data:
        admin.password: '{{ "{{ .password_hash }}" }}'
        admin.passwordMtime: '{{ "{{ .password_mtime }}" }}'
        server.secretkey: '{{ "{{ .server_secret_key }}" }}'
        tls.crt: '{{ "{{ .tls_certificate }}" }}'
        tls.key: '{{ "{{ .tls_private_key }}" }}'
  data:
    {{- range $key := list "password_hash" "password_mtime" "server_secret_key" "tls_certificate" "tls_private_key" }}
    - secretKey: {{ $key }}
      remoteRef:
        key: /retail/platform/argocd/admin
        property: {{ $key }}
    {{- end }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-redis
  namespace: argocd
spec:
  refreshInterval: 5m
  secretStoreRef: {name: retail-argocd-secrets, kind: SecretStore}
  target:
    name: argocd-redis
    template:
      engineVersion: v2
      data:
        auth: '{{ "{{ .password }}" }}'
  data:
    - secretKey: password
      remoteRef:
        key: /retail/platform/argocd/redis
        property: password
