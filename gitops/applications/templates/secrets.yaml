apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets-reader
  annotations:
    eks.amazonaws.com/role-arn: {{ index .Values.roles (printf "eso-%s" .Values.environment) | default "REPLACE_FROM_TERRAFORM" | quote }}
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: retail-secrets
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-southeast-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets-reader
{{- range $service := list "catalog" "cart" "orders" }}
{{- $prefix := printf "RETAIL_%s_PERSISTENCE_" (upper $service) }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $service }}-mysql
spec:
  refreshInterval: 5m
  secretStoreRef: {name: retail-secrets, kind: SecretStore}
  target:
    name: {{ $service }}-runtime
    template:
      engineVersion: v2
      data:
        {{ $prefix }}PROVIDER: mysql
        {{ $prefix }}ENDPOINT: '{{ "{{ .host }}:{{ .port }}" }}'
        {{- if eq $service "catalog" }}
        {{ $prefix }}DB_NAME: '{{ "{{ .database }}" }}'
        {{ $prefix }}USER: '{{ "{{ .username }}" }}'
        {{ $prefix }}TLS: rds
        {{ $prefix }}CA_FILE: /etc/retail/tls/rds-ca.pem
        {{- else }}
        {{ $prefix }}{{ ternary "DATABASE" "NAME" (eq $service "cart") }}: '{{ "{{ .database }}" }}'
        {{ $prefix }}USERNAME: '{{ "{{ .username }}" }}'
        {{ $prefix }}SSL_MODE: VERIFY_IDENTITY
        {{ $prefix }}TRUST_STORE_URL: file:/etc/retail/tls/rds-truststore.p12
        {{- end }}
        {{ $prefix }}PASSWORD: '{{ "{{ .password }}" }}'
  data:
    {{- range $key := list "host" "port" "database" "username" "password" }}
    - secretKey: {{ $key }}
      remoteRef:
        key: /retail/{{ $.Values.environment }}/{{ $service }}/mysql
        property: {{ $key }}
    {{- end }}
{{- end }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: checkout-redis
spec:
  refreshInterval: 5m
  secretStoreRef: {name: retail-secrets, kind: SecretStore}
  target:
    name: checkout-runtime
    template:
      engineVersion: v2
      data:
        RETAIL_CHECKOUT_PERSISTENCE_PROVIDER: redis
        RETAIL_CHECKOUT_PERSISTENCE_REDIS_URL: '{{ "{{ .url }}" }}'
        RETAIL_CHECKOUT_PERSISTENCE_REDIS_KEY_PREFIX: "retail:{{ .Values.environment }}:"
        RETAIL_CHECKOUT_ENDPOINTS_ORDERS: http://orders
  data:
    - secretKey: url
      remoteRef: {key: /retail/{{ .Values.environment }}/checkout/redis, property: url}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: orders-rabbitmq
spec:
  refreshInterval: 5m
  secretStoreRef: {name: retail-secrets, kind: SecretStore}
  target:
    name: orders-rabbitmq-runtime
    template:
      engineVersion: v2
      data:
        RETAIL_ORDERS_MESSAGING_PROVIDER: rabbitmq
        RETAIL_ORDERS_MESSAGING_RABBITMQ_ADDRESSES: '{{ "{{ .addresses }}" }}'
        RETAIL_ORDERS_MESSAGING_RABBITMQ_USERNAME: '{{ "{{ .username }}" }}'
        RETAIL_ORDERS_MESSAGING_RABBITMQ_PASSWORD: '{{ "{{ .password }}" }}'
        SPRING_RABBITMQ_VIRTUAL_HOST: '{{ "{{ .vhost }}" }}'
        SPRING_RABBITMQ_SSL_ENABLED: "true"
        SPRING_RABBITMQ_SSL_VALIDATE_SERVER_CERTIFICATE: "true"
        SPRING_RABBITMQ_SSL_VERIFY_HOSTNAME: "true"
  data:
    {{- range $key := list "addresses" "username" "password" "vhost" }}
    - secretKey: {{ $key }}
      remoteRef: {key: /retail/{{ $.Values.environment }}/orders/rabbitmq, property: {{ $key }}}
    {{- end }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: catalog-opensearch
spec:
  refreshInterval: 5m
  secretStoreRef: {name: retail-secrets, kind: SecretStore}
  target:
    name: catalog-opensearch-runtime
    template:
      engineVersion: v2
      data:
        RETAIL_CATALOG_SEARCH_ENABLED: "true"
        RETAIL_CATALOG_SEARCH_OS_ENDPOINT: '{{ "{{ .endpoint }}" }}'
        RETAIL_CATALOG_SEARCH_OS_USERNAME: '{{ "{{ .username }}" }}'
        RETAIL_CATALOG_SEARCH_OS_PASSWORD: '{{ "{{ .password }}" }}'
        RETAIL_CATALOG_SEARCH_OS_INDEX: products-{{ .Values.environment }}
        RETAIL_CATALOG_SEARCH_OS_TLS_SKIP_VERIFY: "false"
  data:
    {{- range $key := list "endpoint" "username" "password" }}
    - secretKey: {{ $key }}
      remoteRef: {key: /retail/{{ $.Values.environment }}/catalog/opensearch, property: {{ $key }}}
    {{- end }}
