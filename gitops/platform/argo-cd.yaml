global:
  nodeSelector:
    workload: management
  tolerations:
  - key: workload
    operator: Equal
    value: management
    effect: NoSchedule
controller:
  replicas: 1
server:
  replicas: 1
  service:
    type: ClusterIP
redis-ha:
  enabled: false
configs:
  cm:
    resource.customizations.health.argoproj.io_Application: "hs = {}\nhs.status =\
      \ \"Progressing\"\nif obj.status ~= nil and obj.status.health ~= nil then\n\
      \  hs.status = obj.status.health.status\nend\nreturn hs\n"
  params:
    server.insecure: false
