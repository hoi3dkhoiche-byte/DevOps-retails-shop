deploymentMode: SingleBinary
loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  schemaConfig:
    configs:
    - from: '2026-01-01'
      store: tsdb
      object_store: s3
      schema: v13
      index:
        prefix: index_
        period: 24h
  storage:
    type: s3
    bucketNames:
      chunks: REPLACE_LOG_BUCKET
      ruler: REPLACE_LOG_BUCKET
      admin: REPLACE_LOG_BUCKET
    s3:
      region: ap-southeast-1
  limits_config:
    retention_period: 168h
  compactor:
    retention_enabled: true
    delete_request_store: s3
singleBinary:
  nodeSelector:
    workload: management
  tolerations:
  - key: workload
    operator: Equal
    value: management
    effect: NoSchedule
  replicas: 1
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 2Gi
  persistence:
    enabled: true
    storageClass: gp3-retain
    size: 10Gi
backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0
gateway:
  enabled: false
chunksCache:
  enabled: false
resultsCache:
  enabled: false
serviceAccount:
  create: true
  name: loki
  annotations: {}
