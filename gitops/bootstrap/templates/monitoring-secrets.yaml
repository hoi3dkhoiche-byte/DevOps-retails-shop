apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets-reader
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
    eks.amazonaws.com/role-arn: {{ index .Values.roles "eso-monitoring" | default "REPLACE_FROM_TERRAFORM" | quote }}
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: retail-platform-secrets
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-southeast-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets-reader
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  refreshInterval: 5m
  secretStoreRef: {name: retail-platform-secrets, kind: SecretStore}
  target:
    name: grafana-admin
  data:
    - secretKey: username
      remoteRef: {key: /retail/platform/grafana/admin, property: username}
    - secretKey: password
      remoteRef: {key: /retail/platform/grafana/admin, property: password}
{{- if .Values.alerting.enabled }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-notification-config
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  refreshInterval: 5m
  secretStoreRef: {name: retail-platform-secrets, kind: SecretStore}
  target:
    name: alertmanager-notification-config
  data:
    - secretKey: alertmanager.yaml
      remoteRef:
        key: /retail/platform/alertmanager/config
        property: alertmanager.yaml
{{- end }}
