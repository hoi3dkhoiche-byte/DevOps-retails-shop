fullnameOverride: checkout
replicaCount: 1
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi
affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
      - matchExpressions:
        - key: workload
          operator: In
          values:
          - prod
tolerations:
- key: workload
  operator: Equal
  value: prod
  effect: NoSchedule
envFromSecrets:
- checkout-runtime
secretRevision: initial
service:
  type: ClusterIP
  port: 80
