fullnameOverride: ui
replicaCount: 1
resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 1Gi
affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
      - matchExpressions:
        - key: workload
          operator: In
          values:
          - dev
tolerations:
- key: workload
  operator: Equal
  value: dev
  effect: NoSchedule
envFromSecrets: []
secretRevision: initial
service:
  type: ClusterIP
  port: 8080
rollout:
  enabled: true
  autoPromotionEnabled: true
  previewReplicaCount: 1
  scaleDownDelaySeconds: 120
  revisionHistoryLimit: 3
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70
app:
  endpoints:
    catalog: http://catalog:8080
    carts: http://carts:8080
    checkout: http://checkout:8080
    orders: http://orders:8080
  search:
    enabled: true
  chat:
    enabled: false
