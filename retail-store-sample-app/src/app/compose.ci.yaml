# Verified app archives only; fixture images retain their versioned pull policy.
services:
  ui:
    build: !reset null
    image: ${CI_UI_IMAGE:?verified image required}
    pull_policy: never
    platform: linux/amd64
    ports: !override
      - "127.0.0.1:8888:8080"
    environment:
      RETAIL_UI_ENDPOINTS_CATALOG: http://catalog:8080
      RETAIL_UI_ENDPOINTS_CARTS: http://cart:8080
      RETAIL_UI_ENDPOINTS_CHECKOUT: http://checkout:8080
      RETAIL_UI_ENDPOINTS_ORDERS: http://orders:8080
  catalog:
    build: !reset null
    image: ${CI_CATALOG_IMAGE:?verified image required}
    pull_policy: never
    platform: linux/amd64
    ports: !override
      - "127.0.0.1:8081:8080"
  cart:
    build: !reset null
    image: ${CI_CART_IMAGE:?verified image required}
    pull_policy: never
    platform: linux/amd64
    ports: !override
      - "127.0.0.1:8082:8080"
  checkout:
    build: !reset null
    image: ${CI_CHECKOUT_IMAGE:?verified image required}
    pull_policy: never
    platform: linux/amd64
    ports: !override
      - "127.0.0.1:8085:8080"
    environment:
      RETAIL_CHECKOUT_ENDPOINTS_ORDERS: http://orders:8080
  orders:
    build: !reset null
    image: ${CI_ORDERS_IMAGE:?verified image required}
    pull_policy: never
    platform: linux/amd64
    ports: !override
      - "127.0.0.1:8083:8080"
  opensearch:
    ports: !override []
